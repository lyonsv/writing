appId: com.lyonsv.margin
productName: Margin
copyright: Copyright © 2026 Vincent Lyons
directories:
  output: release
  buildResources: build
# main.js and preload.js are fully bundled by esbuild; no runtime node_modules.
files:
  - dist/**
  - package.json
  - "!node_modules/**"
npmRebuild: false
extraResources:
  - from: ../app/dist
    to: web
  # Margin's licence and third-party notices (incl. the IBM Plex Mono OFL), opened from Help › Licences.
  - from: ../../LICENSE
    to: licenses/LICENSE.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
mac:
  category: public.app-category.productivity
  # Generated by `pnpm brand:build` from assets/brand/icon-macos.svg (ADR 0018).
  icon: build/icon.icns
  target:
    - target: dmg
    - target: zip
  # Unsigned local builds; signing/notarisation is deferred to M4.
  identity: null
  hardenedRuntime: false
  darkModeSupport: true
# Electron fuses (flipped in the binary at package time). Note: these disable
# --inspect, so Playwright drives the unpacked build instead; see verify:packaged.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Unsigned build: re-apply the ad-hoc signature so arm64 macOS will launch it.
  resetAdHocDarwinSignature: true
